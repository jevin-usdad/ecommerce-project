name: Laravel CI (Docker)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Copy env file
      - name: Copy .env
        run: cp .env.example .env

      # 3. Build Docker images
      - name: Build Docker images
        run: docker compose build

      # 4. Start containers
      - name: Start containers
        run: docker compose up -d

      # 5. Wait for MySQL healthcheck
      - name: Wait for MySQL
        run: |
          until docker compose exec mysql mysqladmin ping -h localhost -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 3
          done

      # 6. Install Composer dependencies
      - name: Install Composer dependencies
        run: docker compose exec app composer install --no-interaction --prefer-dist

      # 7. Generate app key
      - name: Generate app key
        run: docker compose exec app php artisan key:generate

      # 8. Run migrations
      - name: Run migrations
        run: docker compose exec app php artisan migrate --force

      # 9. Run tests
      - name: Run tests
        run: docker compose exec app php artisan test

      # 10. Stop containers
      - name: Stop containers
        if: always()
        run: docker compose down -v
